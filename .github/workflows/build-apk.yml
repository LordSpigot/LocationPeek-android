name: Build Location Peek APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: LocationPeek

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Java 17 einrichten
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Android SDK Pakete installieren
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Gradle 8.9 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Projekt prüfen
        run: |
          pwd
          ls -la
          ls -la app

      - name: APK bauen
        run: gradle --no-daemon assembleDebug

      - name: APK umbenennen
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             LocationPeek-v1.0.0.apk

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: LocationPeek-v1.0.0-APK
          path: LocationPeek/LocationPeek-v1.0.0.apk
          if-no-files-found: error
